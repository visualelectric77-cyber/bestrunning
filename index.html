<!doctype html>
<html lang="es-ES" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>RITMUP</title>
    <meta name="description" content="Tu entrenador personal de cinta: clases guiadas con voz, plan semanal y progreso." />

    <!-- PWA en iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RITMUP" />
    <meta name="application-name" content="RITMUP" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./assets/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./assets/icons/icon-152.png" />

    <!-- Pantallas de arranque (iPhone, vertical) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./assets/splash/splash-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./assets/splash/splash-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./assets/splash/splash-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="./assets/splash/splash-1179x2556.png"
    />

    <!-- Primer pintado oscuro, sin destello blanco -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
        color-scheme: dark;
      }
      /* Réplica de la pantalla de arranque para que el paso splash → app sea continuo */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #000;
        transition: opacity 0.4s ease;
      }
      /* La «r» de RITMUP centrada a un 22 % del ancho, como assets/splash (negro puro, sin texto) */
      #boot svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22vmin;
        height: auto;
        aspect-ratio: 68 / 100;
        transform: translate(-50%, -50%);
      }
      .is-booted #boot {
        opacity: 0;
        pointer-events: none;
      }
      /* App nativa: la pantalla de arranque ya la pone iOS; la web no repite la suya */
      html.is-native #boot {
        display: none;
      }
    </style>
    <script>
      try {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bestrunning) document.documentElement.classList.add('is-native');
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/screens-main.css" />
    <link rel="stylesheet" href="./css/screens-more.css" />
    <link rel="stylesheet" href="./css/player.css" />
    <link rel="stylesheet" href="./css/motion.css" />
    <link rel="stylesheet" href="./css/music.css" />
    <link rel="stylesheet" href="./css/intro.css" />

    <link rel="modulepreload" href="./js/app.js" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <main id="view"></main>
      <nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
    </div>
    <div id="sheet-root"></div>
    <div id="toast-root" aria-live="polite"></div>

    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 68 100" focusable="false"><path fill="#fff" fill-rule="evenodd" d="M0 100L0 50A50 50 0 0 1 50 0L68 0L68 14.5L50 14.5A35.5 35.5 0 0 0 14.5 50L14.5 100ZM29.19 26.36A31.5 31.5 0 0 1 50 18.5L68 18.5L68 33L50 33A17 17 0 0 0 39.48 36.65Z"/><path fill="#FF5A1F" d="M18.5 100L18.5 50A31.5 31.5 0 0 1 26.36 29.19L36.65 39.48A17 17 0 0 0 33 50L33 100Z"/></svg>
    </div>

    <noscript>
      <p style="padding: 24px; font-family: -apple-system, system-ui, sans-serif; text-align: center">
        RITMUP necesita JavaScript activado para funcionar.
      </p>
    </noscript>
  </body>
</html>
